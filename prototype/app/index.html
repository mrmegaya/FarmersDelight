<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FarmersDelight</title>
<style>
:root{--g:#2F7D3B;--gd:#1F5C2A;--gl:#DDEFD9;--a:#B8690A;--al:#FCE8C4;--ad:#7A4D06;--b:#1A4C84;--bl:#DCEAF8;--r:#9B2F26;--rl:#F8DEDA;--bg:#F5F7F2;--ink:#17231B;--mut:#5C6A60;--ln:#DDE3D8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Roboto,'Noto Sans Tamil',system-ui,sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{min-height:100vh;padding-bottom:86px}
#app.nonav{padding-bottom:24px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:21px;font-weight:800;flex:1;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{padding:0 16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px}
.pad{padding:14px}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.p-g{background:var(--gl);color:#1D5A28}.p-a{background:var(--al);color:var(--ad)}.p-b{background:var(--bl);color:var(--b)}.p-r{background:var(--rl);color:var(--r)}.p-n{background:#E8ECE4;color:#3F4B43}
.btn{height:52px;border-radius:14px;background:var(--g);color:#fff;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.sec{background:#fff;color:var(--gd);border:1.5px solid var(--g)}
.btn.warn{background:#fff;color:var(--r);border:1.5px solid #E3B5AF}
.btn.amber{background:var(--a)}
.btn:disabled{opacity:.45}
.btn.sm{height:40px;font-size:14px;width:auto;border-radius:12px;white-space:nowrap;padding:0 12px}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.fld{width:100%;height:50px;border:1.5px solid #CBD3C6;background:#fff;border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;outline:0}
.fld:focus{border-color:var(--g)}
textarea.fld{height:84px;padding:12px 14px;resize:none}
.flab{display:block;font-size:13px;font-weight:800;color:#33403A;margin:14px 0 6px}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.lab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.muted{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:800}.big{font-size:20px;font-weight:800}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:center;z-index:10;padding-bottom:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);min-width:62px;min-height:52px;justify-content:center;position:relative}
.nav button.on{color:var(--g)}
.badge{position:absolute;top:4px;right:12px;min-width:18px;height:18px;border-radius:99px;background:#C8412F;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ib .badge{top:-5px;right:-5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:99px;border:1.5px solid #CBD3C6;background:#fff;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.seg{display:flex;background:#E6EBE1;border-radius:12px;padding:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:800;font-size:14px;color:var(--mut);padding:0 12px;white-space:nowrap}
.seg .on{background:#fff;color:#256330;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tile{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.lc{display:flex;gap:12px;padding:12px;align-items:center;margin-bottom:10px;width:100%;text-align:left}
.lc .nm{font-size:16px;font-weight:800}
.lc .pr{text-align:right;flex:none}
.lc .pr .v{font-size:18px;font-weight:800}
.mid{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map{position:relative;height:250px;background:#E4ECD9;overflow:hidden}
.map .rd{position:absolute;background:#fff;border-radius:5px}
.map .pk{position:absolute;background:#CFE3BC;border-radius:16px}
.map .wt{position:absolute;background:#C6DDEE;border-radius:24px}
.mk{position:absolute;transform:translate(-50%,-50%);height:30px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:800;display:flex;align-items:center;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(23,35,27,.25);white-space:nowrap;background:var(--g)}
.mk.a{background:var(--a)}.mk.n{background:var(--b)}.mk.me{background:#17231B}
.you{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#2D6CB5;border:3px solid #fff;box-shadow:0 0 0 9px rgba(45,108,181,.2)}
.maptag{position:absolute;left:10px;top:10px;background:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pinarea{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(47,125,59,.18);border:2px dashed var(--g)}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#C8412F;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.stp{display:flex;align-items:center;border:1.5px solid #CBD3C6;border-radius:14px;background:#fff;height:50px;overflow:hidden}
.stp button{width:50px;height:100%;font-size:22px;font-weight:800;color:var(--gd)}
.stp input{flex:1;text-align:center;border:0;outline:0;font-size:17px;font-weight:800;min-width:0;background:none}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEF1EA;font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{font-weight:800;text-align:right}
.tl{position:relative;padding-left:26px}
.tl .st{position:relative;padding:0 0 16px}
.tl .st:before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#CBD3C6;border:2px solid #fff;box-shadow:0 0 0 1.5px #CBD3C6}
.tl .st.done:before{background:var(--g);box-shadow:0 0 0 1.5px var(--g)}
.tl .st:after{content:"";position:absolute;left:-15px;top:18px;bottom:-2px;width:2px;background:#DDE3D8}
.tl .st:last-child:after{display:none}
.tl .st.done:after{background:var(--g)}
.note{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.note.g{background:#EDF6EA;color:#244F2C}.note.a{background:#FDF1DA;color:#5E3B05}.note.b{background:#E6F0FA;color:#173F6B}.note.r{background:var(--rl);color:var(--r)}
.note .ic{width:18px;height:18px;margin-top:1px}
.stars{display:flex;gap:6px}
.stars button{font-size:36px;line-height:1;color:#D5DBD0}
.stars button.on{color:#E08A00}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vg{background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:8px 2px;text-align:center;font-size:11.5px;font-weight:700;min-height:76px}
.vg .e{font-size:28px;display:block;margin-bottom:3px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1/1;border-radius:14px;border:2px dashed #BFC8BA;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;color:#5C6A60;position:relative;text-align:center;padding:4px;overflow:hidden}
.slot.cover{border-color:#2F7D3B;background:#F3F9F1;color:#1F5C2A}
.slot.err{border-color:#C8412F;background:#FBEDEB;color:#9B2F26}
.slot.vid{border-color:#E2C48E;background:#FDF6E8;color:#7A4D06}
.slot.rem,.tile.rem{border:2px solid #E3B5AF;background:repeating-linear-gradient(45deg,#FBEDEB,#FBEDEB 6px,#fff 6px,#fff 12px);color:#9B2F26}
.slot .pl{font-size:24px;font-weight:400;line-height:1}
.slot .req{color:#9B2F26;font-size:10.5px}
.slot.fill{border:0;padding:0;background:#17231B}
.slot.fill img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(23,35,27,.75);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.badge2{position:absolute;left:5px;bottom:5px;background:#2F7D3B;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;z-index:2}
.rbadge{position:absolute;left:5px;top:5px;background:#C8412F;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;z-index:2}
.dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;z-index:2}
.playc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2;font-size:14px;color:#17231B;border:0}
.playc.big{width:60px;height:60px;margin:-30px 0 0 -30px;font-size:24px}
.opt{display:flex;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid #EEF1EA;width:100%;text-align:left}
.opt:last-child{border-bottom:0}
.opt .oi{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.photo-big{border-radius:16px;overflow:hidden;background:#17231B;margin-bottom:12px}
.photo-big img{width:100%;max-height:52vh;object-fit:contain;display:block}
.cam2{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:flex;flex-direction:column}
.camtop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;height:64px}
.cbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:700}
.cpill{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:800}
.vf2{position:relative;flex:1;overflow:hidden;background:#111}
.vf2 video{width:100%;height:100%;object-fit:cover}
.grid3{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px) 0 0/100% 33.3%,linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px) 0 0/33.3% 100%;pointer-events:none}
.ctip{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}#flash.on{opacity:.8}
.cmodes{display:flex;justify-content:center;gap:28px;padding:14px 0 6px}.cmodes button{color:rgba(255,255,255,.7);font-weight:800;font-size:13px;letter-spacing:.5px}.cmodes button.on{color:#F2A33A}
.cbar{display:flex;align-items:center;justify-content:space-around;padding:10px 0 26px}
.cthumb{width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid #fff;background:#222}.cthumb img{width:100%;height:100%;object-fit:cover}
.shutter2{width:78px;height:78px;border-radius:50%;border:5px solid #fff;display:flex;align-items:center;justify-content:center}.shutter2 i{display:block;width:60px;height:60px;border-radius:50%;background:#fff}
.shutter2:active i{transform:scale(.9)}
.recbtn{width:86px;height:86px;line-height:0}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center}
.viewer video,.viewer img{width:100%;max-height:80vh;object-fit:contain}
.vclose{position:absolute;top:14px;left:14px;z-index:2}
.vcap{color:#fff;font-size:13px;font-weight:700;margin-top:12px;opacity:.85}
.vprog{width:80%;height:4px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:10px;overflow:hidden}.vprog i{display:block;height:100%;width:0;background:#F2A33A}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;height:260px;background:#E8ECE4}
.gal::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;scroll-snap-align:start;position:relative}
.gslide img{width:100%;height:100%;object-fit:cover;display:block}
.wrap{position:relative}
.gcount{position:absolute;right:26px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#CBD3C6}.dots i.on{background:#2F7D3B;width:18px;border-radius:9px}
.hero.rem2{flex-direction:column;background:repeating-linear-gradient(45deg,#FBEDEB,#FBEDEB 10px,#fff 10px,#fff 20px);height:200px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #BFC8BA;flex:none;position:relative}.radio.on{border-color:#2F7D3B}.radio.on:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#2F7D3B}
#busy{position:fixed;inset:0;background:rgba(10,20,12,.55);z-index:70;display:flex;align-items:center;justify-content:center}
.busybox{background:#fff;border-radius:18px;padding:22px 28px;text-align:center;min-width:220px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid #DDEFD9;border-top-color:#2F7D3B;margin:0 auto;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.trimbox{position:relative;border-radius:18px;overflow:hidden;background:#000;height:360px}.trimbox video{width:100%;height:100%;object-fit:contain}
.range{width:100%;margin-top:14px;accent-color:#B8690A;height:32px}
.vg.sp{background:#FDF6E8;border-style:dashed;border-color:#E2C48E}
.vg .cnt{display:block;font-size:10.5px;color:#5C6A60;font-weight:600;margin-top:2px}
.crow{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.crow.on{border-color:var(--g);box-shadow:0 0 0 1.5px var(--g) inset;background:#F3F9F1}
.emo{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;font-size:24px}
.emo.on{border-color:var(--g);background:#EDF6EA;box-shadow:0 0 0 1.5px var(--g) inset}
.vg.on{border-color:var(--g);background:#EDF6EA;box-shadow:0 0 0 1.5px var(--g) inset}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#BFC8BA;position:relative;flex:none;outline:0}
.sw:before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--g)}.sw:checked:before{left:25px}
.prog{height:10px;border-radius:99px;background:#E6EBE1;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:99px}
.stat{flex:1;padding:12px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:800}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:44px;margin-bottom:8px}
.sheetbg{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:85vh;overflow:auto}
.grab{width:42px;height:5px;border-radius:9px;background:#D5DBD0;margin:-6px auto 12px}
#toast{position:fixed;left:16px;right:16px;bottom:86px;background:#17231B;color:#fff;padding:13px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:none}
.hero{height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:84px}
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none;background:var(--gl);color:#1D5A28}
.logo{width:84px;height:84px;border-radius:26px;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:46px;margin:0 auto}
.rc{display:flex;gap:12px;align-items:center;padding:16px;margin-bottom:12px;width:100%;text-align:left}
.rc .e{font-size:40px;width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.cd{color:var(--r);font-weight:800}
.lnk{color:var(--gd);font-weight:800}
.item{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;border-bottom:1px solid #EEF1EA;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{flex:1;font-size:15px;font-weight:700}
.otp{letter-spacing:10px;text-align:center;font-size:22px}
.unread{background:#F2F8EF}
.fab{position:fixed;right:16px;bottom:84px;height:52px;padding:0 20px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(31,92,42,.35);z-index:9}
</style>
</head>

function placeOrder(lid) {

/* ---------- storage (IndexedDB, with in-memory fallback) */

      r.onsuccess = function () { IDB = r.result; var keys = [], seen = {};

          cur.onsuccess = function (e) { var c = e.target.result; if (c) { MURL[c.key] = URL.createObjectURL(c.value); c.continue(); } else fin(); };
          cur.onerror = fin;

}

}

  if (UI.draft && UI.draft.media) UI.draft.media.forEach(function (m) { used[m.id] = 1; used[m.id + "_t"] = 1; });

  var l = L(lid); if (!l) return [topbar("", true), false];
  if (i === "v") {
    setTimeout(function () { playSample(l); }, 50);
    return ['<div class="viewer"><button class="cbtn vclose" onclick="back()">✕</button><canvas id="vc" width="720" height="720" style="width:100%;max-height:80vh;object-fit:contain"></canvas><div class="vcap">🔇 ' + t("noSound") + " · " + t("sampleNote") + '</div><div class="vprog"><i id="vpi"></i></div></div>', false];
  }
  return ['<div class="viewer"><button class="cbtn vclose" onclick="back()">✕</button><img src="' + samplePhoto(l, +i, 900) + '" alt=""><div class="vcap">' + t("sampleNote") + "</div></div>", false];
}
function playSample(l) {
  var c = document.getElementById("vc"); if (!c) return;
  var g = c.getContext("2d"), base = new Image(), t0 = Date.now(); base.src = samplePhoto(l, 3, 720);
  var e = (VEG[l.veg] || ["🥗"])[0];
  (function frame() {
    var el = (Date.now() - t0) / 1000; if (!document.getElementById("vc")) return;
    g.drawImage(base, 0, 0, 720, 720); g.font = "90px sans-serif"; g.textAlign = "center";
    for (var k = 0; k < 5; k++) g.fillText(e, (k * 160 + el * 60) % 820 - 50, 360 + Math.sin(el * 2 + k) * 160);
    var p = document.getElementById("vpi"); if (p) p.style.width = Math.min(100, el * 10) + "%";
    if (el < VSEC) requestAnimationFrame(frame);
  })();
}

function ownHero(l) {
  var ph = livePhotos(l.media);
  if (ph.length && mUrl(ph[0].id)) return '<div class="hero" style="padding:0;overflow:hidden"><img src="' + mUrl(ph[0].id) + '" style="width:100%;height:100%;object-fit:cover" alt=""></div>';
  var v = VEG[l.veg] || ["🥗", "#E8ECE4"];
  return '<div class="hero" style="background:' + v[1] + '">' + v[0] + "</div>";
}

/* ------------------------------------------------------------ simulation engine */
function settleAuctions() {
  var ch = false;
  st.listings.forEach(function (l) {
    if (l.mode !== "auction") return;
    if (l.status === "active" && l.ends <= now()) {
      ch = true;
      var sorted = l.bids.slice().sort(function (a, b) { return b.amount - a.amount; }), b = sorted[0];
      if (!b || (l.reserve && b.amount < l.reserve)) { l.status = "closed"; if (l.fid === "me") note("farmer", t("n_unsold") + " " + vn(l.veg), "f-home"); return; }
      l.status = "won"; l.winner = b.by === "me" ? "me" : b.name; l.confirmBy = l.ends + 2 * HOUR; l.skipped = [];
      if (b.by === "me") note("buyer", t("n_won") + " " + vn(l.veg) + " · " + money(b.amount), "bids");
      else if (l.fid === "me") sched("simWinConfirm", rnd(5000, 9000), { lid: l.id });
      else l.status = "sold";
    }
    if (l.status === "won" && l.confirmBy <= now()) {
      ch = true;
      var wasMe = l.winner === "me";
      l.skipped = (l.skipped || []).concat([l.winner]);
      if (wasMe) { note("buyer", t("n_wonPassed") + " " + vn(l.veg), "bids"); l.bids = l.bids.filter(function (x) { return x.by !== "me"; }); }
      var next = l.bids.slice().sort(function (a, b) { return b.amount - a.amount; }).filter(function (x) { return l.skipped.indexOf(x.by === "me" ? "me" : x.name) < 0 && (!l.reserve || x.amount >= l.reserve); })[0];
      if (!next) { l.status = "closed"; return; }
      l.winner = next.by === "me" ? "me" : next.name; l.confirmBy = now() + 2 * HOUR;
      if (l.fid === "me") { note("farmer", t("n_passed") + " " + vn(l.veg), "f-offers"); sched("simWinConfirm", rnd(5000, 9000), { lid: l.id }); }
      else if (l.winner !== "me") l.status = "sold";
    }
  });
  return ch;
}
function runEvent(ev) {
  var d = ev.data, l = d.lid ? L(d.lid) : null, o = d.oid ? O(d.oid) : null;
  switch (ev.type) {
    case "farmerConfirm":
      if (o && o.status === "placed") { o.status = "confirmed"; o.hist.confirmed = now(); note("buyer", farmerOf(o.fid).name + " " + t("n_confirmed") + " · #" + o.no, "order/" + o.id); sched("farmerReady", rnd(8000, 15000), { oid: o.id }); }
      break;
    case "farmerReady":
      if (o && o.status === "confirmed") { o.status = "ready"; o.hist.ready = now(); note("buyer", t("n_ready") + " " + vn(o.veg) + " · #" + o.no, "order/" + o.id); }
      break;
    case "rivalBid":
      if (l && l.status === "active" && l.ends > now()) {
        var b = topBid(l);
        if (b && b.by === "me") { l.bids.push({ by: "sim", name: pick(BUYERS), amount: b.amount + l.inc * rnd(1, 2), at: now() }); note("buyer", t("n_outbid") + " " + vn(l.veg) + " · " + money(topBid(l).amount), "listing/" + l.id); }
      }
      break;
    case "farmerReply":
      var of = l && findOffer(l, d.oid);
      if (of && of.status === "pending") {
        var fn = farmerOf(l.fid).name, r = of.amount / l.price;
        if (r >= 0.9) {
          of.status = "accepted"; var q = Math.min(of.qty, l.qty);
          var ord = newOrder(l, { qty: q, price: of.amount, src: "nego", status: "confirmed" }); l.qty -= q; if (l.qty <= 0) { l.qty = 0; l.status = "sold"; }
          sched("farmerReady", rnd(8000, 15000), { oid: ord.id });
          note("buyer", fn + " " + t("n_offerAcc") + " " + vn(l.veg) + " · " + money(of.amount), "order/" + ord.id);
        } else if (r >= 0.7) { of.status = "countered"; of.counter = Math.round((of.amount + l.price) / 2); note("buyer", fn + " " + t("n_offerCtr") + " " + vn(l.veg) + " · " + money(of.counter), "listing/" + l.id); }
        else { of.status = "rejected"; note("buyer", fn + " " + t("n_offerRej") + " " + vn(l.veg), "listing/" + l.id); }
      }
      break;
    case "simBid":
      if (l && l.status === "active" && l.ends > now() && d.n < 5) {
        var tb = topBid(l), amt = tb ? tb.amount + l.inc * rnd(1, 2) : l.start + l.inc * rnd(0, 2);
        l.bids.push({ by: "sim", name: pick(BUYERS), amount: amt, at: now() });
        note("farmer", t("n_newBid") + " " + vn(l.veg) + " · " + money(amt), "f-offers");
        sched("simBid", rnd(20000, 45000), { lid: l.id, n: d.n + 1 });
      }
      break;
    case "simOffer":
      if (l && l.status === "active" && d.n < 3) {
        var oa = Math.round(l.price * (0.78 + Math.random() * 0.17));
        l.offers.push({ id: uid(), by: "sim", name: pick(BUYERS), amount: oa, qty: Math.max(1, Math.min(l.qty, rnd(2, 8))), status: "pending", at: now() });
        note("farmer", t("n_newOffer") + " " + vn(l.veg) + " · " + money(oa), "f-offers");
        sched("simOffer", rnd(30000, 60000), { lid: l.id, n: d.n + 1 });
      }
      break;
    case "simOrder":
      if (l && l.status === "active" && d.n < 3) {
        var qq = Math.max(1, Math.min(l.qty, rnd(2, 6))), dl = l.del.on && Math.random() < 0.5;
        newOrder(l, { qty: qq, price: l.price, method: dl ? "delivery" : "pickup", buyer: "sim", buyerName: pick(BUYERS), buyerPhone: "9" + rnd(100000000, 999999999) });
        l.qty -= qq; if (l.qty <= 0) { l.qty = 0; l.status = "sold"; }
        note("farmer", t("n_newOrder") + " " + vn(l.veg) + " · " + qq + " " + un(l.unit), "f-orders");
        sched("simOrder", rnd(35000, 70000), { lid: l.id, n: d.n + 1 });
      }
      break;
    case "simWinConfirm":
      if (l && l.status === "won" && l.winner !== "me") {
        var wb = l.bids.filter(function (x) { return x.name === l.winner; }).sort(function (a, b) { return b.amount - a.amount; })[0];
        l.status = "sold";
        newOrder(l, { qty: l.qty, price: wb.amount, src: "auction", buyer: "sim", buyerName: l.winner, buyerPhone: "9" + rnd(100000000, 999999999) });
        note("farmer", t("n_winConf") + " " + vn(l.veg) + " · " + l.winner, "f-orders");
      }
      break;
    case "simCounterReply":
      var oc = l && findOffer(l, d.oid);
      if (oc && oc.status === "countered" && l.status === "active") {
        if (oc.counter <= oc.amount * 1.1) {
          oc.status = "accepted"; oc.amount = oc.counter; var q2 = Math.min(oc.qty, l.qty);
          newOrder(l, { qty: q2, price: oc.counter, src: "nego", buyer: "sim", buyerName: oc.name, buyerPhone: "9" + rnd(100000000, 999999999) });
          l.qty -= q2; if (l.qty <= 0) { l.qty = 0; l.status = "sold"; }
          note("farmer", oc.name + " " + t("n_ctrAcc") + " " + vn(l.veg), "f-orders");
        } else { oc.status = "rejected"; note("farmer", oc.name + " " + t("n_ctrRej") + " " + vn(l.veg), "f-offers"); }
      }
      break;
    case "simReview":
      if (o && !o.reviewed && !o.disputed) {
        var s = Math.random() < 0.7 ? 5 : 4; st.farm.rs += s; st.farm.rc++; o.reviewed = true;
        st.reviews.unshift({ fid: "me", name: o.buyerName, stars: s, text: pick(["Fresh and good quantity.", "Fair price, friendly farmer.", "Ready on time. Will buy again."]), at: now() });
        note("farmer", o.buyerName + " " + t("n_review") + " · " + "★".repeat(s), "farmer/me");
      }
      break;
    case "verify":
      if (st.farm && !st.farm.verified) { st.farm.verified = true; st.farm.vstate = "done"; note("farmer", "✅ " + t("n_verified"), "profile"); }
      break;
  }
}
function refreshMarket() {
  if (APP === "farmer") return false;
  var active = st.listings.filter(function (l) { return l.fid !== "me" && l.status === "active" && !(l.mode === "auction" && l.ends <= now()); }).length;
  if (active >= 4) return false;
  var tps = TEMPLATES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 6);
  tps.forEach(function (tp) { var c = JSON.parse(JSON.stringify(tp)); if (c[3].mins) c[3].mins = rnd(15, 240); st.listings.unshift(makeListing(c)); });
  st.listings = st.listings.filter(function (l) { return l.fid === "me" || l.status === "active" || l.status === "won" || now() - l.created < 3 * 24 * HOUR || st.orders.some(function (o) { return o.lid === l.id; }); });
  note("buyer", t("n_newListings"), "explore");
  return true;
}
var pendingRender = false;
function tick() {
  if (!st) return;
  var ch = false, due = [], keep = [];
  st.events.forEach(function (e) { (e.at <= now() ? due : keep).push(e); });
  if (due.length) { st.events = keep; due.forEach(runEvent); ch = true; }
  if (settleAuctions()) ch = true;
  if (st.user && refreshMarket()) ch = true;
  if (ch) {
    save();
    var a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (typing || document.getElementById("sheet").innerHTML || /^#(cam|trim|play|view)/.test(location.hash || "")) pendingRender = true; else render(true);
  }
  document.querySelectorAll("[data-end]").forEach(function (el) { el.textContent = left(+el.getAttribute("data-end") - now()); });
}
document.addEventListener("focusout", function () { setTimeout(function () { var a = document.activeElement; if (pendingRender && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && !document.getElementById("sheet").innerHTML) { pendingRender = false; render(true); } }, 150); });

/* ------------------------------------------------------------ boot */
load();
registerCrops();
if (!location.hash) location.replace(st.user ? (st.role === "farmer" ? "#f-home" : "#explore") : "#welcome");
idbOpen().then(function () { mCleanup(); render(); setInterval(tick, 1000); });
</script>
